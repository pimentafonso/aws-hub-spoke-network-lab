# Connectivity matrix: the lab's test contract.
#
# Every row is one TCP connection attempt from a test instance and the result
# the design expects. After each deploy, scripts/matrix.py runs the rows for the
# deployed stage through SSM Run Command and fails on any difference.
#
# A deny row names the layer that should stop the traffic:
#   security-group  dropped at the destination, so VPC Flow Logs show REJECT
#   routing         no route (TGW blackhole, missing propagation, isolated VPC
#                   or overlapping CIDR), so the packet never reaches the
#                   destination VPC and its flow logs have no record of it
#
# Stages are cumulative: running stage m3 runs every m2 and m3 row.

version: 1

stages: [m2, m3, m4]

# Test instances. Every one listens on TCP 80 (web) and 8443 (admin).
# Security groups allow 80 from all lab ranges and 8443 only from the hub.
hosts:
  hub-svc:
    vpc: hub
    families: [ipv4, ipv6]
    stage: m2
  spoke-a:
    vpc: spoke-a
    families: [ipv4, ipv6]
    stage: m2
  spoke-b:
    vpc: spoke-b
    families: [ipv4, ipv6]
    stage: m2
  onprem:
    vpc: onprem
    families: [ipv4] # the VPN carries IPv4 only
    stage: m3
  consumer:
    vpc: consumer
    families: [ipv4]
    stage: m4

# Destinations that are not test instances.
targets:
  internet:
    # AWS-owned, dual-stack and outside every lab VPC.
    address: s3.dualstack.eu-west-1.amazonaws.com
    families: [ipv4, ipv6]
    stage: m2
  privatelink:
    # Resolved at run time from the interface endpoint's DNS name in the
    # consumer VPC; the endpoint service fronts spoke-a through an NLB.
    address: output:privatelink_endpoint_dns
    families: [ipv4]
    stage: m4

checks:
  # --- M2: Transit Gateway segmentation, centralised IPv4 egress -----------
  - id: spoke-a-to-hub-web
    from: spoke-a
    to: hub-svc
    port: 80
    family: ipv4
    expect: allow
    stage: m2
    reason: rt-spoke-a has the hub attachment's routes propagated.
  - id: spoke-b-to-hub-web
    from: spoke-b
    to: hub-svc
    port: 80
    family: ipv4
    expect: allow
    stage: m2
    reason: rt-spoke-b has the hub attachment's routes propagated.
  - id: spoke-a-to-hub-web-v6
    from: spoke-a
    to: hub-svc
    port: 80
    family: ipv6
    expect: allow
    stage: m2
    reason: The attachments are dual-stack; spoke A routes the hub's /56 to the TGW, and rt-spoke-a has it propagated.
  - id: spoke-a-to-spoke-b
    from: spoke-a
    to: spoke-b
    port: 80
    family: ipv4
    expect: deny
    layer: routing
    stage: m2
    reason: rt-spoke-a blackholes 10.0.0.0/8; only the hub's more specific /16 is propagated.
  - id: spoke-b-to-spoke-a
    from: spoke-b
    to: spoke-a
    port: 80
    family: ipv4
    expect: deny
    layer: routing
    stage: m2
    reason: rt-spoke-b blackholes 10.0.0.0/8; only the hub's more specific /16 is propagated.
  - id: spoke-a-to-spoke-b-v6
    from: spoke-a
    to: spoke-b
    port: 80
    family: ipv6
    expect: deny
    layer: routing
    stage: m2
    reason: Spoke A routes only the hub's /56 to the TGW, and spoke B's egress-only gateway admits no inbound connection.
  - id: spoke-a-to-hub-admin
    from: spoke-a
    to: hub-svc
    port: 8443
    family: ipv4
    expect: deny
    layer: security-group
    stage: m2
    reason: The route exists, but the admin port accepts the hub range only.
  - id: hub-to-spoke-a-admin
    from: hub-svc
    to: spoke-a
    port: 8443
    family: ipv4
    expect: allow
    stage: m2
    reason: Shared services may manage the spokes.
  - id: spoke-a-to-internet
    from: spoke-a
    to: internet
    port: 443
    family: ipv4
    expect: allow
    stage: m2
    reason: Default route to the hub attachment, then the hub's NAT.
  - id: spoke-b-to-internet
    from: spoke-b
    to: internet
    port: 443
    family: ipv4
    expect: allow
    stage: m2
    reason: Default route to the hub attachment, then the hub's NAT.
  - id: spoke-a-to-internet-v6
    from: spoke-a
    to: internet
    port: 443
    family: ipv6
    expect: allow
    stage: m2
    reason: IPv6 leaves through spoke A's own egress-only internet gateway; it cannot be centralised (ADR 5).

  # --- M3: site-to-site VPN with BGP ----------------------------------------
  - id: onprem-to-hub-web
    from: onprem
    to: hub-svc
    port: 80
    family: ipv4
    expect: allow
    stage: m3
    reason: rt-vpn has the hub's routes propagated, and the TGW advertises them to on-prem over BGP.
  - id: onprem-to-spoke-a-web
    from: onprem
    to: spoke-a
    port: 80
    family: ipv4
    expect: allow
    stage: m3
    reason: rt-vpn has spoke A's routes propagated; rt-spoke-a learns on-prem's range back over BGP.
  - id: onprem-to-spoke-b-web
    from: onprem
    to: spoke-b
    port: 80
    family: ipv4
    expect: deny
    layer: routing
    stage: m3
    reason: rt-vpn does not propagate spoke B, so on-prem never learns its range and sends it to the internet instead.
  - id: spoke-a-to-onprem-web
    from: spoke-a
    to: onprem
    port: 80
    family: ipv4
    expect: allow
    stage: m3
    reason: rt-spoke-a has the VPN's BGP routes propagated; on-prem's /16 beats the 172.16.0.0/12 blackhole.
  - id: spoke-b-to-onprem-web
    from: spoke-b
    to: onprem
    port: 80
    family: ipv4
    expect: deny
    layer: routing
    stage: m3
    reason: rt-spoke-b has no VPN routes, so on-prem's range hits the 172.16.0.0/12 blackhole at the TGW.

  # --- M4: PrivateLink across an overlapping CIDR ---------------------------
  - id: consumer-to-privatelink
    from: consumer
    to: privatelink
    port: 80
    family: ipv4
    expect: allow
    stage: m4
    reason: The interface endpoint is local to the consumer VPC; the NLB reaches spoke A.
  - id: consumer-to-spoke-a-direct
    from: consumer
    to: spoke-a
    port: 80
    family: ipv4
    expect: deny
    layer: routing
    stage: m4
    reason: The consumer VPC uses spoke A's CIDR, so spoke A's address is local and no route can reach it.
  - id: consumer-to-internet
    from: consumer
    to: internet
    port: 443
    family: ipv4
    expect: deny
    layer: routing
    stage: m4
    reason: The consumer VPC has no internet or NAT gateway and no TGW attachment.
