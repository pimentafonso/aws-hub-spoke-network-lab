[project]
name = "aws-hub-spoke-network-lab"
version = "0.1.0"
description = "Test and measurement tooling for a hub-and-spoke AWS networking lab."
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
# The test and measurement scripts are imported by the tests as modules.
known-first-party = ["matrix", "reaper"]
